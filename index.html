<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="VLA 与强化学习指南。内容正在整理中。">
    <meta name="theme-color" content="#f6f5ef">
    <title>VLA × RL Guide</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #183e35; background: #f6f5ef; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
      main { width: 100%; max-width: 720px; }
      .eyebrow { font-size: 12px; letter-spacing: .18em; font-weight: 650; }
      h1 { margin: 30px 0 22px; font-size: clamp(44px, 9vw, 80px); line-height: 1.08; letter-spacing: -.055em; font-weight: 650; }
      .intro { margin: 0; max-width: 540px; color: #4a625a; font-size: 18px; line-height: 1.9; }
      .status { display: inline-flex; align-items: center; gap: 9px; margin: 32px 0 40px; padding: 9px 14px; border: 1px solid #d7e0d6; border-radius: 999px; font-size: 13px; color: #3e5d50; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #548164; }
      footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; border-top: 1px solid #d7ded4; padding-top: 23px; color: #596b60; font-size: 13px; }
      a { color: #183e35; text-underline-offset: 5px; }
      a:hover { color: #326e50; }
      a:focus-visible { outline: 2px solid #326e50; outline-offset: 6px; border-radius: 2px; }
      @media (max-width: 420px) { body { padding: 28px 20px; } .intro { font-size: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">VLA · REINFORCEMENT LEARNING</p>
      <h1>VLA × RL Guide</h1>
      <p class="intro">视觉、语言、动作与强化学习。<br>学习指南正在整理中。</p>
      <p class="status">内容准备中</p>
      <footer>
        <span>hqy-cmd / vla-rl-guide</span>
        <a href="https://github.com/hqy-cmd/vla-rl-guide">在 GitHub 查看仓库 ↗</a>
      </footer>
    </main>
  </body>
</html>
